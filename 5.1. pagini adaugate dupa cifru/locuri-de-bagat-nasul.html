<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Locuri de băgat nasul – Marin Gabriel</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <style>
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      background: #ffffff;
      color: #222;
      font-family: 'Poppins', sans-serif;
    }

    .page {
      max-width: 1320px;
      margin: 0 auto;
      padding: 45px 48px 70px;
    }

    h1 {
      font-size: 54px;
      line-height: 1.1;
      font-weight: 500;
      margin: 0 0 42px;
    }

    hr {
      border: none;
      border-top: 1px solid #ddd;
      margin: 28px 0 38px;
    }

    .summary-block {
      display: inline-block;
      width: fit-content;
      max-width: 100%;
      margin: 0 0 24px;
    }

    .summary-title {
      font-size: 34px;
      line-height: 1.35;
      font-weight: 400;
      margin: 0 0 34px;
      padding-top: 34px;
      border-top: 1px solid #ddd;
      white-space: nowrap;
    }

    .stats {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 36px;
    }

    .stat {
      height: 128px;
      border: 1px solid #ddd;
      background: #fafafa;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .stat strong {
      display: block;
      font-size: 32px;
      line-height: 1;
      font-weight: 500;
      margin: 0 0 8px;
    }

    .stat span {
      display: block;
      font-size: 19px;
      line-height: 1.2;
      font-weight: 400;
    }

    .filter-panel {
      margin: 4px 0 26px;
      padding: 20px;
      border: 1px solid #ddd;
      background: #fafafa;
    }

    .filter-title {
      margin: 0 0 14px;
      font-size: 22px;
      font-weight: 500;
    }

    .filter-grid {
      display: grid;
      grid-template-columns: 1.1fr 1.1fr 1.1fr auto;
      gap: 14px;
      align-items: end;
    }

    .filter-field { display: flex; flex-direction: column; gap: 7px; }

    .filter-field label {
      font-size: 13px;
      color: #666;
      font-weight: 500;
    }

    .filter-field select,
    .filter-button {
      height: 42px;
      border: 1px solid #bbb;
      background: #fff;
      color: #222;
      font-family: 'Poppins', sans-serif;
      font-size: 14px;
      padding: 0 12px;
      outline: none;
    }

    .filter-field select:focus { border-color: #555; }

    .filter-button {
      cursor: pointer;
      white-space: nowrap;
    }

    .filter-button:hover { background: #eee; }

    .filter-field.is-hidden { display: none; }

    #map {
      width: 100%;
      height: 590px;
      border: 1px solid #d5d5d5;
      margin: 10px 0 40px;
    }

    .leaflet-popup-content {
      margin: 12px 14px;
      font-family: 'Poppins', sans-serif;
    }

    /* Popup-urile cu multe spectacole/festivaluri rămân în interiorul hărții. */
    .leaflet-popup-content:has(.popup-more-toggle) {
      width: 420px !important;
      max-width: min(420px, calc(100vw - 90px));
    }

    .popup-title {
      display: block;
      margin-bottom: 7px;
      font-size: 15px;
      font-weight: 600;
      color: #222;
    }

    .popup-story {
      max-width: 285px;
      font-size: 13px;
      line-height: 1.55;
      color: #555;
      font-style: normal;
    }

    .leaflet-popup-content:has(.popup-more-toggle) .popup-story {
      width: 100%;
      max-width: none;
    }

    .popup-status {
      display: block;
      margin-top: 7px;
      color: #9a5a00;
      font-size: 12px;
      font-weight: 500;
      font-style: normal;
    }

    .popup-note {
      display: block;
      margin-top: 7px;
      color: #555;
      font-size: 12.5px;
      font-style: italic;
    }

    .popup-more-toggle {
      display: block;
      width: fit-content;
      margin-top: 8px;
      padding: 0;
      border: 0;
      background: transparent;
      color: #1f5f99;
      font-family: 'Poppins', sans-serif;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .popup-more-toggle:hover { color: #123f69; }

    .popup-more {
      display: none;
      width: 100%;
      max-width: 100%;
      margin-top: 12px;
      padding-top: 11px;
      border-top: 1px solid #e0e0e0;
      font-size: 12.5px;
      line-height: 1.55;
      color: #333;
    }

    .popup-more.is-open {
      display: block;
      max-height: min(330px, 52vh);
      overflow-y: auto;
      overflow-x: hidden;
      padding-right: 8px;
      scrollbar-gutter: stable;
      overscroll-behavior: contain;
    }

    .popup-more.is-open::-webkit-scrollbar { width: 8px; }
    .popup-more.is-open::-webkit-scrollbar-thumb {
      background: #c8c8c8;
      border-radius: 8px;
    }

    .popup-event {
      margin: 0 0 12px;
      padding: 0 0 12px;
      border-bottom: 1px solid #ededed;
    }

    .popup-event:last-child {
      margin-bottom: 0;
      padding-bottom: 0;
      border-bottom: 0;
    }

    .popup-event-title {
      display: block;
      margin-bottom: 2px;
      font-weight: 600;
      color: #222;
    }

    .popup-event-date,
    .popup-event-venue,
    .popup-festival-line {
      display: block;
    }

    .popup-festival-line + .popup-festival-line { margin-top: 6px; }

    .popup-inline-toggle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      margin-left: 5px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: #efefef;
      color: #555;
      font-family: 'Poppins', sans-serif;
      font-size: 11px;
      line-height: 1;
      cursor: pointer;
      vertical-align: 1px;
    }

    .popup-inline-toggle:hover { background: #e2e2e2; color: #222; }

    .popup-inline-details {
      display: none;
      margin-top: 8px;
      padding: 8px 10px;
      border-left: 2px solid #ddd;
      font-size: 12.5px;
      line-height: 1.55;
      color: #333;
    }

    .popup-inline-details.is-open { display: block; }

    .leaflet-control-layers {
      font-family: 'Poppins', sans-serif;
      font-size: 13px;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 18px;
      margin: -15px 0 34px;
      color: #555;
      font-size: 14px;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      white-space: nowrap;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
      border: 1px solid rgba(0,0,0,.18);
    }

    .places-title {
      font-size: 28px;
      font-weight: 500;
      margin: 0 0 22px;
    }

    .places {
      columns: 3;
      column-gap: 48px;
      font-size: 17px;
      line-height: 1.85;
      margin-bottom: 42px;
    }

    .domain-group {
      break-inside: avoid;
      margin: 0 0 28px;
    }

    .domain-title {
      font-size: 21px;
      font-weight: 600;
      margin: 0 0 10px;
    }

    .category-group {
      break-inside: avoid;
      margin: 0 0 18px;
    }

    .category-title {
      font-size: 16px;
      font-weight: 600;
      margin: 0 0 6px;
      color: #555;
    }

    .place-item {
      break-inside: avoid;
      margin-bottom: 4px;
    }

    .place-meta {
      color: #777;
      font-size: 14px;
    }

    .place-status {
      color: #9a5a00;
      font-size: 14px;
      font-weight: 500;
    }

    .empty-state {
      padding: 18px;
      border: 1px dashed #ccc;
      background: #fafafa;
      color: #666;
      font-size: 15px;
    }

    .footer {
      text-align: center;
      color: #666;
      font-size: 14px;
      padding: 26px 0 0;
    }

    @media (max-width: 900px) {
      .page { padding: 34px 22px 55px; }
      h1 { font-size: 40px; }
      .summary-block { display: block; width: 100%; }
      .summary-title { white-space: normal; font-size: 26px; }
      .stats { grid-template-columns: 1fr; gap: 18px; }
      .stat { height: 112px; }
      .filter-grid { grid-template-columns: 1fr; }
      #map { height: 430px; }
      .leaflet-popup-content:has(.popup-more-toggle) {
        width: min(360px, calc(100vw - 78px)) !important;
      }
      .popup-more.is-open { max-height: min(250px, 45vh); }
      .places { columns: 1; }
    }
  </style>
</head>

        </div>

        <button class="filter-button" id="reset-filters" type="button">Resetează filtrele</button>

    </section>

    <div id="map"></div>
    <div class="legend" id="legend"></div>

    <div class="places" id="places"></div>

    <hr>

    <div class="footer">· © 2026 Marin Gabriel ·</div>
  </main>

    function romanianCompare(a, b) {
      return a.localeCompare(b, "ro");
    }

    function uniqueSorted(values) {
      return [...new Set(values.filter(Boolean))].sort(romanianCompare);
    }

    function countPlacesBy(items, key) {
      return items.reduce((counts, item) => {
        const value = item[key];
        if (!value) return counts;
        counts.set(value, (counts.get(value) || 0) + 1);
        return counts;
      }, new Map());
    }

    function formatOptionLabel(label, count) {
      return `${label} (${count})`;
    }

    function fillSelect(select, options, selectedValue) {
      select.innerHTML = "";
      options.forEach(option => {
        const el = document.createElement("option");
        el.value = option.value;
        el.textContent = option.label;
        if (option.value === selectedValue) el.selected = true;
        select.appendChild(el);
      });
    }

    function getCategoriesForDomain(domain) {
      const visiblePlaces = domain === "__all__"
        ? locuri
        : locuri.filter(loc => loc.domeniu === domain);

      const existing = new Set(visiblePlaces.map(loc => loc.categorie));
      return categoryOrder.filter(cat => existing.has(cat));
    }

    function renderFilterControls() {
      const domainSelect = document.getElementById("filter-domain");
      const categorySelect = document.getElementById("filter-category");
      const typeSelect = document.getElementById("filter-restaurant-type");
      const typeField = document.getElementById("restaurant-type-field");

      const domainCounts = countPlacesBy(locuri, "domeniu");
      const domainOptions = [
        { value: "__all__", label: formatOptionLabel("Toate domeniile", locuri.length) },
        ...domainOrder.map(domain => ({
          value: domain,
          label: formatOptionLabel(domain, domainCounts.get(domain) || 0)
        }))
      ];
      fillSelect(domainSelect, domainOptions, filterState.domain);

      const visiblePlacesForCategory = filterState.domain === "__all__"
        ? locuri
        : locuri.filter(loc => loc.domeniu === filterState.domain);

      const categories = getCategoriesForDomain(filterState.domain);
      if (filterState.category !== "__all__" && !categories.includes(filterState.category)) {
        filterState.category = "__all__";
      }

      const categoryCounts = countPlacesBy(visiblePlacesForCategory, "categorie");
      const categoryOptions = [
        {
          value: "__all__",
          label: formatOptionLabel("Toate subcategoriile", visiblePlacesForCategory.length)
        },
        ...categories.map(cat => ({
          value: cat,
          label: formatOptionLabel(cat, categoryCounts.get(cat) || 0)
        }))
      ];
      fillSelect(categorySelect, categoryOptions, filterState.category);

      const showRestaurantType = filterState.category === "Restaurante";
      typeField.classList.toggle("is-hidden", !showRestaurantType);

      if (!showRestaurantType) {
        filterState.restaurantType = "__all__";
      }

      const restaurantPlaces = locuri.filter(
        loc => loc.domeniu === "Locuri de luat masa" && loc.categorie === "Restaurante"
      );
      const restaurantTypes = uniqueSorted(restaurantPlaces.map(loc => loc.tipRestaurant));
      const restaurantTypeCounts = countPlacesBy(restaurantPlaces, "tipRestaurant");

      const typeOptions = [
        { value: "__all__", label: formatOptionLabel("Toate tipurile", restaurantPlaces.length) },
        ...restaurantTypes.map(type => ({
          value: type,
          label: formatOptionLabel(type, restaurantTypeCounts.get(type) || 0)
        }))
      ];
      fillSelect(typeSelect, typeOptions, filterState.restaurantType);
    }

    function getFilteredPlaces() {
      return locuri.filter(loc => {
        const domainMatches = filterState.domain === "__all__" || loc.domeniu === filterState.domain;
        const categoryMatches = filterState.category === "__all__" || loc.categorie === filterState.category;
        const typeMatches = filterState.restaurantType === "__all__" || loc.tipRestaurant === filterState.restaurantType;
        return domainMatches && categoryMatches && typeMatches;
      });
    }

    function renderLegend(places) {
      const legend = document.getElementById("legend");
      legend.innerHTML = "";

      const activeDomains = domainOrder.filter(domain => places.some(loc => loc.domeniu === domain));

      activeDomains.forEach(domain => {
        const item = document.createElement("span");
        item.className = "legend-item";
        item.innerHTML = '<span class="dot" style="background:' + domainColors[domain] + '"></span>' + domain;
        legend.appendChild(item);
      });
    }

    function popupExpandedContent(loc) {
      const details = popupExtraDetails[loc.id];
      if (!details) return "";

      if (details.type === "spectacole") {
        return details.events.map(event => (
          '<div class="popup-event">' +
            '<span class="popup-event-title">' + escapeHTML(event.title) + '</span>' +
            '<span class="popup-event-date">' + escapeHTML(event.date) + '</span>' +
            '<span class="popup-event-venue">' + escapeHTML(event.venue) + '</span>' +
          '</div>'
        )).join("");
      }

      if (details.type === "festival") {
        const artists = details.artists
          .map(artist => escapeHTML(artist))
          .join('; ');

        return (
          '<span class="popup-festival-line">' + escapeHTML(details.period) + ': ' + artists + '</span>'
        );
      }

      if (details.type === "cinema_festival") {
        const films = details.films
          .map(film => escapeHTML(film))
          .join(', ');

        return (
          '<span class="popup-festival-line"><strong>Perioadă:</strong> ' + escapeHTML(details.period) + '</span>' +
          '<span class="popup-festival-line"><strong>Filme văzute:</strong> ' + films + '</span>'
        );
      }

      return "";
    }

    function toggleInlinePopupDetails(event, button) {
      if (event) {
        event.preventDefault();
        event.stopPropagation();
      }

      const details = button.nextElementSibling;
      if (!details) return false;

      const willOpen = !details.classList.contains("is-open");
      details.classList.toggle("is-open", willOpen);
      button.textContent = willOpen ? "−" : "+";
      button.setAttribute("aria-expanded", String(willOpen));
      button.setAttribute("aria-label", willOpen ? "Ascunde detaliile festivalului" : "Arată detaliile festivalului");

      requestAnimationFrame(() => {
        const popup = map && map._popup;
        if (popup && popup.isOpen && popup.isOpen() && typeof popup._adjustPan === "function") {
          popup._adjustPan();
        }
      });

      return false;
    }

    function togglePopupMore(event, button) {
      if (event) {
        event.preventDefault();
        event.stopPropagation();
      }

      const details = button.nextElementSibling;
      if (!details) return false;

      const willOpen = !details.classList.contains("is-open");
      details.classList.toggle("is-open", willOpen);
      button.textContent = willOpen ? "Vezi mai puțin" : "Vezi mai mult";
      button.setAttribute("aria-expanded", String(willOpen));

      if (willOpen) details.scrollTop = 0;

      // Conținutul se schimbă fără a reconstrui popup-ul. După ce browserul
      // îi calculează noua înălțime, cerem doar repoziționarea pe hartă.
      requestAnimationFrame(() => {
        const popup = map && map._popup;
        if (popup && popup.isOpen && popup.isOpen() && typeof popup._adjustPan === "function") {
          popup._adjustPan();
        }
      });

      return false;
    }

    function popupContent(loc) {
      const status = loc.status ? '<span class="popup-status">' + escapeHTML(loc.status) + '</span>' : "";
      const note = loc.observatii ? '<span class="popup-note">' + escapeHTML(loc.observatii) + '</span>' : "";
      const details = popupExtraDetails[loc.id];

      if (details && details.type === "cinema_festival") {
        const inlineDetails = popupExpandedContent(loc);
        return (
          '<span class="popup-title">' + escapeHTML(loc.nume) + '</span>' +
          '<div class="popup-story">' + escapeHTML(popupInfo(loc)) + status + note +
            '<span class="popup-festival-line" style="margin-top:10px"><strong>Festival:</strong> ' + escapeHTML(details.festival) +
              '<button type="button" class="popup-inline-toggle" aria-expanded="false" aria-label="Arată detaliile festivalului" onclick="return toggleInlinePopupDetails(event, this)">+</button>' +
              '<span class="popup-inline-details">' + inlineDetails + '</span>' +
            '</span>' +
          '</div>'
        );
      }

      const expanded = popupExpandedContent(loc);
      const more = expanded
        ? '<button type="button" class="popup-more-toggle" aria-expanded="false" onclick="return togglePopupMore(event, this)">Vezi mai mult</button>' +
          '<div class="popup-more">' + expanded + '</div>'
        : "";

      return (
        '<span class="popup-title">' + escapeHTML(loc.nume) + '</span>' +
        '<div class="popup-story">' + escapeHTML(popupInfo(loc)) + status + note + more + '</div>'
      );
    }

    map.on("popupopen", event => {
      const popupElement = event.popup && event.popup.getElement ? event.popup.getElement() : null;
      if (!popupElement) return;
      L.DomEvent.disableClickPropagation(popupElement);
      L.DomEvent.disableScrollPropagation(popupElement);
    });

    function renderMap(places) {
      markerGroup.clearLayers();
      const markers = [];

      places.forEach(loc => {
        const color = domainColors[loc.domeniu] || "#6a00ff";

        const marker = L.circleMarker([loc.lat, loc.lng], {
          radius: 5,
          color: color,
          fillColor: color,
          weight: 1.5,
          fillOpacity: 0.88
        }).bindPopup(popupContent(loc), {
          minWidth: popupExtraDetails[loc.id] ? Math.min(420, Math.max(280, map.getSize().x - 70)) : 50,
          maxWidth: popupExtraDetails[loc.id] ? Math.min(460, Math.max(280, map.getSize().x - 70)) : 300,
          autoPan: true,
          autoPanPaddingTopLeft: [24, 24],
          autoPanPaddingBottomRight: [24, 24]
        });

        marker.addTo(markerGroup);
        markers.push(marker);
      });

      if (markers.length > 0) {
        const group = L.featureGroup(markers);
        map.fitBounds(group.getBounds().pad(0.16));
      } else {
        map.setView([44.4268, 26.1025], 12);
      }
    }

    function placeExtra(loc) {
      const extras = [];
      if (loc.oras && loc.oras !== "București") extras.push(loc.oras);
      if (loc.tipRestaurant) extras.push(loc.tipRestaurant);
      if (loc.tipLoc) extras.push(loc.tipLoc);
      return extras.length ? ' <span class="place-meta">— ' + extras.join(" · ") + '</span>' : "";
    }

    function renderPlaces(places) {
      const container = document.getElementById("places");
      container.innerHTML = "";

      if (!places.length) {
        container.innerHTML = '<div class="empty-state">Nu există locuri pentru filtrul selectat.</div>';
      }

      domainOrder.forEach(domain => {
        const domainItems = places.filter(loc => loc.domeniu === domain);
        if (!domainItems.length) return;

        const domainGroup = document.createElement("section");
        domainGroup.className = "domain-group";

        const domainTitle = document.createElement("h3");
        domainTitle.className = "domain-title";
        domainTitle.textContent = domain;
        domainGroup.appendChild(domainTitle);

        categoryOrder.forEach(category => {
          const categoryItems = domainItems
            .filter(loc => loc.categorie === category)
            .sort((a, b) => romanianCompare(a.nume, b.nume));

          if (!categoryItems.length) return;

          const categoryGroup = document.createElement("section");
          categoryGroup.className = "category-group";

          const categoryTitle = document.createElement("h4");
          categoryTitle.className = "category-title";
          categoryTitle.textContent = category;
          categoryGroup.appendChild(categoryTitle);

          categoryItems.forEach(loc => {
            const div = document.createElement("div");
            div.className = "place-item";
            div.innerHTML = loc.nume + placeExtra(loc) + (loc.status ? ' <span class="place-status">— ' + loc.status + '</span>' : "");
            categoryGroup.appendChild(div);
          });

          domainGroup.appendChild(categoryGroup);
        });

        container.appendChild(domainGroup);
      });

    }

    function updateView() {
      renderFilterControls();
      const places = getFilteredPlaces();
      renderMap(places);
      renderLegend(places);
      renderPlaces(places);
    }

    document.getElementById("filter-domain").addEventListener("change", event => {
      filterState.domain = event.target.value;
      filterState.category = "__all__";
      filterState.restaurantType = "__all__";
      updateView();
    });

    document.getElementById("filter-category").addEventListener("change", event => {
      filterState.category = event.target.value;
      filterState.restaurantType = "__all__";
      updateView();
    });

    document.getElementById("filter-restaurant-type").addEventListener("change", event => {
      filterState.restaurantType = event.target.value;
      updateView();
    });

    document.getElementById("reset-filters").addEventListener("click", () => {
      filterState.domain = "__all__";
      filterState.category = "__all__";
      filterState.restaurantType = "__all__";
      updateView();
    });

    updateView();
  </script>
</body>
</html>
