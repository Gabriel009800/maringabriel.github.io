 visuoRows+=detailRow('Copierea scaunului',`${a.chairData?.edges?.length||0} segmente`,'Desen tridimensional complet, fără linii suplimentare',a.chair,1,'Toate liniile trebuie să se întâlnească, iar orientarea să fie păstrată.');
 visuoRows+=detailRow('Ceas: contur','Evaluare geometrică automată','Contur închis, rotund sau pătrat, cu distorsiuni cel mult minore',a.clockContour,1,'Conturul poate fi cerc sau pătrat.');
 visuoRows+=detailRow('Ceas: cifre',`${Object.keys(a.clockData?.numbers||{}).length} cifre plasate`,'Toate cifrele 1–12, în ordine și în cadranele corespunzătoare',a.clockNumbers,1,'Fără cifre suplimentare; dispunere circulară.');
 visuoRows+=detailRow('Ceas: limbi','Ora desenată 9:10','Două limbi unite; limba orei mai scurtă decât cea a minutelor',a.clockHands,1,'Unirea trebuie să fie aproape de centrul cadranului.');

 let namingRows='';
 namingRows+=detailRow('Animalul 1',n.snake,'șarpe / tip de șarpe',a.naming?.snake,1,'Boa, cobra și alte tipuri corecte de șarpe sunt acceptate.');
 namingRows+=detailRow('Animalul 2',n.elephant,'elefant',a.naming?.elephant,1,'');
 namingRows+=detailRow('Animalul 3',n.crocodile,'crocodil / aligator',a.naming?.crocodile,1,'');

 const serialScore=s.serial7Correct===0?0:s.serial7Correct===1?1:s.serial7Correct<=3?2:3;
 let attentionRows='';
 attentionRows+=detailRow('Cifre în ordine directă',dr.forward,'8-1-5-2-4',a.digitsForward,1,'Repetare exactă în ordinea prezentată.');
 attentionRows+=detailRow('Cifre în ordine inversă',dr.backward,'7-4-2',a.digitsBackward,1,'Răspunsul corect este inversarea secvenței 2-4-7.');
 attentionRows+=detailRow('Vigilență',`${a.vigilanceErrors??'—'} erori; răspunsuri corecte ${vig.hits??'—'}, omisiuni ${vig.misses??'—'}, alarme false ${vig.falseAlarms??'—'}, apăsări suplimentare ${vig.extra??'—'}`,'0–1 erori',s.vigilance,1,'O eroare înseamnă apăsare la altă literă sau lipsa apăsării la A.');
 attentionRows+=detailRow('Scăderi succesive',(a.serial7||[]).join(' · '),'Scădere repetată cu 7 din răspunsul anterior',serialScore,3,`${s.serial7Correct??0} scăderi corecte, evaluate independent.`);

 let languageRows='';
 languageRows+=detailRow('Repetarea propoziției 1',sr[0],'Repetare exactă',a.sentences?.[0],1,'Se punctează omisiunile, substituțiile, adăugările și modificările gramaticale.');
 languageRows+=detailRow('Repetarea propoziției 2',sr[1],'Repetare exactă',a.sentences?.[1],1,'Se punctează omisiunile, substituțiile, adăugările și modificările gramaticale.');
 languageRows+=detailRow('Fluență verbală',(a.fluencyValid||[]).join(', '),'>=11 cuvinte valide cu S în 60 de secunde',s.fluency,1,`${a.fluencyCount??0} cuvinte valide; excluse manual: ${(a.fluencyExcluded||[]).join(', ')||'niciunul'}.`);

 let abstractionRows='';
 abstractionRows+=detailRow('Pat – masă',abs[0]?.response,'mobilier / mobilă / piese de mobilier',abs[0]?.score,1,'Răspunsurile concrete nu sunt punctate.');
 abstractionRows+=detailRow('Scrisoare – telefon',abs[1]?.response,'comunicare / mijloc de comunicare / corespondență',abs[1]?.score,1,'Răspunsurile concrete nu sunt punctate.');

 let recallRows='';
 recNames.forEach((w,i)=>recallRows+=detailRow(w,recLabels[a.recall?.[i]]||'—','Reamintire liberă pentru punctajul MoCA',a.recall?.[i]==='free'?1:0,1,`Contribuție MIS: ${recPts[a.recall?.[i]]??0} puncte.`));

 let orientationRows='';
 Object.values(a.orientation||{}).forEach(o=>orientationRows+=detailRow(o.label,o.response,o.expected??'Conform datei și locului administrării',o.score,1,'Data, ziua și locul trebuie să fie exacte.'));

 const groupedDetails=`<div class="domain-page-group domain-page-visual-naming">${domainBlock('Vizuo-spațial / executiv',s.visuospatialExecutive,5,visuoRows)}${domainBlock('Denumire',s.naming,3,namingRows)}</div><div class="domain-page-group domain-page-attention-language-abstract">${domainBlock('Atenție',s.attention,6,attentionRows)}${domainBlock('Limbaj',s.language,3,languageRows)}${domainBlock('Abstractizare',s.abstraction,2,abstractionRows)}</div><div class="domain-page-group domain-page-memory-orientation">${domainBlock('Reamintire întârziată',s.delayedRecall,5,recallRows)}${domainBlock('Orientare',s.orientation,6,orientationRows)}</div>`;
 const domainData=[['Vizuo-spațial / executiv',s.visuospatialExecutive,5],['Denumire',s.naming,3],['Atenție',s.attention,6],['Limbaj',s.language,3],['Abstractizare',s.abstraction,2],['Reamintire întârziată',s.delayedRecall,5],['Orientare',s.orientation,6]];
 const low=domainData.filter(d=>(d[1]??0)<d[2]);
 const preserved=domainData.filter(d=>(d[1]??0)===d[2]);
 const free=(a.recall||[]).filter(v=>v==='free').length,cat=(a.recall||[]).filter(v=>v==='category').length,multi=(a.recall||[]).filter(v=>v==='multiple').length,none=(a.recall||[]).filter(v=>v==='none').length;
 const memoryPattern=none>0?'Au existat cuvinte care nu au fost recuperate nici după oferirea indiciilor.':cat+multi>0?'Performanța s-a ameliorat parțial după oferirea indiciilor, aspect care poate sugera o componentă de dificultate de recuperare.':'Toate cuvintele au fost reamintite liber, fără indicii.';
 const lowText=low.length?low.map(d=>`${d[0]} (${d[1]??0}/${d[2]})`).join(', '):'niciun domeniu';
 const preservedText=preserved.length?preserved.map(d=>`${d[0]} (${d[1]??0}/${d[2]})`).join(', '):'niciun domeniu cu punctaj maxim';
 const thresholdDistance=Math.max(0,26-(s.total??0));
 const globalConclusion=ok
  ?`Scorul total se situează în intervalul considerat normal pentru acest instrument de screening. În condițiile unei administrări valide, rezultatul nu susține, prin el însuși, existența unei afectări cognitive globale semnificative. ${low.length?`Totuși, punctele pierdute în ${lowText} trebuie interpretate în raport cu istoricul și funcționarea cotidiană.`:'Profilul nu evidențiază pierderi de puncte la nivelul domeniilor evaluate.'}`
  :`Scorul total se situează cu ${thresholdDistance} punct${thresholdDistance===1?'':'e'} sub pragul de screening de 26/30. Rezultatul este compatibil cu prezența unor dificultăți cognitive care necesită clarificare clinică, fără a permite stabilirea unui diagnostic pe baza acestei probe singure.`;
 const profileConclusion=low.length&&preserved.length
  ?`Profilul este neomogen: performanțele relativ păstrate au fost observate în ${preservedText}, iar puncte au fost pierdute în ${lowText}.`
  :low.length?`Puncte au fost pierdute în următoarele domenii: ${lowText}.`:`Toate domeniile au fost parcurse fără pierdere de puncte.`;
 const recommendation=ok
  ?`În cazul în care există plângeri cognitive, modificări funcționale observate de familie sau factori medicali de risc, se recomandă completarea screeningului prin interviu clinic, anamneză și, la nevoie, evaluare neuropsihologică extinsă.`
  :`Se recomandă integrarea rezultatului cu anamneza, nivelul funcționării cotidiene, informațiile aparținătorilor și datele medicale. În funcție de context, sunt indicate evaluare neuropsihologică extinsă și consult medical de specialitate.`;
 const synthesisOverview=`<div class="report-page-group"><div class="report-panel"><h3>Scopul evaluării</h3><p>Administrarea MoCA 8.2 a urmărit examinarea de tip screening a funcționării cognitive globale, cu accent pe abilități vizuo-spațiale și executive, denumire, atenție, limbaj, abstractizare, memorie și orientare.</p></div><div class="report-panel"><h3>Rezultate și profil cognitiv</h3><p>Persoana evaluată a obținut un scor total de <strong class="score-emphasis">${s.total??0}/30</strong>, alcătuit dintr-un scor brut de <strong>${s.rawTotal??0}/30</strong> și o corecție educațională de <strong>+${s.educationCorrection||0}</strong>. ${profileConclusion}</p><p>Reamintirea liberă întârziată a fost de <strong>${free}/5</strong>, iar scorul MIS a fost de <strong>${s.mis??0}/15</strong>: ${free} cuvânt/cuvinte reamintit(e) liber, ${cat} cu indiciu de categorie, ${multi} prin alegere multiplă și ${none} nereamintit(e). ${memoryPattern}</p></div></div>`;
 const synthesisConclusion=`<div class="report-page-group"><div class="report-panel conclusion-panel"><h3>Concluzie psihologică orientativă</h3><p>${globalConclusion}</p><p>${recommendation}</p></div><div class="report-panel"><h3>Limitele interpretării</h3><p>MoCA este un instrument de screening, nu o probă diagnostică autonomă. Concluzia trebuie corelată cu vârsta, școlarizarea, limba dominantă, starea senzorială, dispoziția, oboseala, medicația, istoricul medical și observațiile comportamentale din timpul administrării. Punctarea automată și răspunsurile susceptibile de ambiguitate necesită verificarea examinatorului.</p></div></div>`;
 const memoryRows=recNames.map((w,i)=>`<tr><td>${w}</td><td>${esc(recLabels[a.recall?.[i]]||'—')}</td><td>${a.recall?.[i]==='free'?1:0}/1</td><td>${recPts[a.recall?.[i]]??0}/3</td></tr>`).join('');
 const trialRows=trials.map(t=>`<tr><td>Încercarea ${t.trial}</td><td>${esc(t.response||'—')}</td><td>${(t.words||[]).length}/5</td><td>Fără punctaj direct</td></tr>`).join('')||'<tr><td colspan="4">Date indisponibile.</td></tr>';
 const info=[['Cod client',c.code||'—'],['Vârstă',c.age||'—'],['Sex',c.sex||'—'],['Data aplicării',fmtDate(c.testDate)],['Data nașterii',fmtDate(c.birthDate)],['Școlarizare',c.educationYears!==''&&c.educationYears!==undefined?c.educationYears+' ani':'—'],['Administrat de',c.examiner||'—'],['Context',c.context||'—'],['Durata',fmtDuration(a.elapsedSeconds)],['Data salvării',fmtDate(x.createdAt)],['Corecție educație','+'+(s.educationCorrection||0)],['Status arhivare',x.archivedAt?'Arhivat':'Activ']].map(v=>`<div class="info-item"><span>${esc(v[0])}</span><strong>${esc(v[1])}</strong></div>`).join('');
 $('reportRoot').innerHTML=`<div class="first-print-page"><section class="hero print-only"><p class="kicker">Scorare automată</p><h1>Rezultate MoCA 8.2</h1><p class="muted">Administrare digitală interactivă · scor total 0–30 · MIS 0–15.</p></section><section class="section card"><div class="score-hero"><div class="score-ring" style="--pct:${pct}%;--ring:${ok?'var(--good)':'var(--danger)'}"><div><strong>${s.total??0}</strong><span>din 30</span></div></div><div><p class="kicker">${esc(x.screening?.label||'Rezultat')}</p><h2>${esc(c.code||'Fără cod')}</h2><p class="muted">Aplicare: ${fmtDate(c.testDate)} · Înregistrare: ${fmtDate(x.createdAt)}</p><span class="pill ${ok?'green':'red'}">${ok?'Scor >=26':'Scor <26'}</span></div></div></section>
 <section class="section card"><p class="kicker">Administrare</p><h2>Datele evaluării</h2><div class="info-grid">${info}</div>${a.clinicalNotes?`<div class="notice" style="margin-top:14px"><strong>Observații clinice:</strong> ${esc(a.clinicalNotes)}</div>`:''}</section>
 <section class="section metrics"><div class="metric"><span>Scor brut</span><strong>${s.rawTotal??0}/30</strong></div><div class="metric"><span>Corecție</span><strong>+${s.educationCorrection||0}</strong></div><div class="metric"><span>MIS</span><strong>${s.mis??0}/15</strong></div><div class="metric"><span>Timp</span><strong>${fmtDuration(a.elapsedSeconds)}</strong></div></section>
 <section class="section card"><p class="kicker">Profil cognitiv</p><h2>Scoruri pe domenii</h2><div class="domains">${domains}</div></section></div>
 <div class="visual-clock-page"><section class="section card visual-responses-page"><p class="kicker">Produse grafice</p><h2>Răspunsuri vizuo-spațiale</h2><div class="visual-grid"><div class="visual-card"><h3>Trasee</h3>${trailSvg(a.trailData)}</div><div class="visual-card"><h3>Scaun</h3>${chairSvg(a.chairData)}</div><div class="visual-card"><h3>Ceas</h3>${clockSvg(a.clockData)}</div></div></section>
 <section class="section card clock-criteria-page"><p class="kicker">Ceas</p><h2>Criterii automate ale ceasului</h2><div class="detail-block">${criterion('Contur',a.clockContour,'Contur închis, rotund sau pătrat; sunt tolerate numai distorsiuni minore.')}${criterion('Cifre',a.clockNumbers,'Toate cifrele 1–12, în ordine și în cadranele corespunzătoare.')}${criterion('Limbile',a.clockHands,'Ora 9:10; două limbi unite, cu limba orei mai scurtă.')}</div></section></div>
 <div class="memory-report-page"><section class="section card memory-page"><p class="kicker">Memorie</p><h2>Învățare, reamintire și MIS</h2><div class="table-wrap"><table><thead><tr><th>Etapă</th><th>Răspuns consemnat</th><th>Ținte reproduse</th><th>Punctaj</th></tr></thead><tbody>${trialRows}</tbody></table></div><div class="table-wrap memory-table" style="margin-top:14px"><table><thead><tr><th>Cuvânt</th><th>Nivel de reamintire</th><th>MoCA</th><th>MIS</th></tr></thead><tbody>${memoryRows}</tbody><tfoot><tr><th colspan="2">Total</th><th>${s.delayedRecall??0}/5</th><th>${s.mis??0}/15</th></tr></tfoot></table></div><div class="notice" style="margin-top:14px">MIS: reamintire liberă ×3, indiciu de categorie ×2, alegere multiplă ×1.</div></section>
 <div class="report-text" id="reportText"><section class="section card report-overview-page"><p class="kicker">Raport psihologic orientativ</p><h2>Interpretare și concluzie</h2>${synthesisOverview}</section></div></div><div class="report-text"><section class="section card report-conclusion-page"><p class="kicker">Raport psihologic orientativ</p><h2>Concluzie și limitele interpretării</h2>${synthesisConclusion}</section></div>
 <section class="section card details-section"><p class="kicker">Detalii complete</p><h2>Răspunsuri și reguli de punctare, organizate pe domenii</h2><p class="muted">În interiorul fiecărui domeniu sunt prezentate sarcinile corespunzătoare, fără repetarea denumirii domeniului la fiecare rând.</p><div class="details-by-domain">${groupedDetails}</div></section>`;
}
function visible(){const mode=$('resultFilter').value,all=readStore();return mode==='archived'?all.filter(archived):mode==='all'?all:all.filter(x=>!archived(x))}
function refresh(prefer){const arr=visible(),sel=$('resultSelect');sel.innerHTML=arr.length?arr.map(x=>`<option value="${esc(x.id)}">${esc(x.client?.code||'Fără cod')} · ${fmtDate(x.client?.testDate||x.createdAt)} · ${x.scores?.total??'—'}/30</option>`).join(''):'<option value="">Nu există rezultate</option>';const query=new URLSearchParams(location.search).get('id'),id=prefer||query||arr[0]?.id||'';if(arr.some(x=>x.id===id))sel.value=id;render(arr.find(x=>x.id===sel.value));buttons()}
function buttons(){const x=current();['archiveBtn','deleteBtn','copyBtn','printBtn'].forEach(id=>$(id).disabled=!x);$('archiveBtn').textContent=x?.archivedAt?'Reactivează':'Arhivează'}
$('resultFilter').onchange=()=>refresh();$('resultSelect').onchange=()=>{render(current());buttons()};
$('archiveBtn').onclick=()=>{const x=current();if(!x)return;const arr=readStore(),i=arr.findIndex(v=>v.id===x.id);arr[i].archivedAt=arr[i].archivedAt?null:new Date().toISOString();writeStore(arr);refresh()};
$('deleteBtn').onclick=()=>{const x=current();if(!x||!confirm('Ștergi acest rezultat?'))return;writeStore(readStore().filter(v=>v.id!==x.id));refresh()};
$('copyBtn').onclick=async()=>{try{const text=[...document.querySelectorAll('.report-text')].map(e=>e.innerText.trim()).filter(Boolean).join('\n\n');await navigator.clipboard.writeText(text);$('copyBtn').textContent='Copiat';setTimeout(()=>$('copyBtn').textContent='Copiază raportul',1200)}catch(e){alert('Copierea automată nu a fost permisă.')}};
$('printBtn').onclick=()=>window.print();$('importBtn').onclick=()=>$('jsonImport').click();
$('jsonImport').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{const p=JSON.parse(await f.text()),items=Array.isArray(p)?p:[p],arr=readStore();items.forEach(x=>{if(x&&String(x.instrument||'').includes('MoCA')){if(!x.id)x.id='moca82_'+Date.now()+'_'+Math.random().toString(16).slice(2);const i=arr.findIndex(v=>v.id===x.id);i>=0?arr.splice(i,1,x):arr.unshift(x)}});writeStore(arr);refresh(items[0]?.id)}catch(err){alert('Fișier JSON invalid.')}e.target.value=''};
function unlock(){sessionStorage.setItem(AUTH_KEY,'1');document.body.classList.remove('locked');refresh()}
$('authForm').onsubmit=e=>{e.preventDefault();if($('passwordInput').value===PASSWORD)unlock();else $('authError').classList.remove('hidden')};if(sessionStorage.getItem(AUTH_KEY)==='1')unlock();
</script></body></html>
