<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Concursuri post psiholog – Evaluări psihologice</title>
<style>
:root{
  --bg:#f7f3ee;
  --paper:#fffdfa;
  --text:#2f241d;
  --muted:#73675e;
  --line:#e7d8c9;
  --accent:#8a4f22;
  --accent-soft:#f3e5d6;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
a{color:inherit}
.page{width:min(1180px,calc(100% - 32px));margin:28px auto 60px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}
.back-link{display:inline-flex;align-items:center;gap:8px;padding:9px 13px;border:1px solid var(--line);border-radius:999px;background:var(--paper);text-decoration:none;color:var(--accent);font-weight:700;font-size:.9rem}
.back-link:hover{background:#fbf6f0}
.hero{padding:26px 28px;border:1px solid var(--line);border-radius:20px;background:var(--paper);box-shadow:0 1px 0 rgba(52,38,29,.03)}
.hero .eyebrow{margin:0 0 7px;color:var(--accent);font-size:.78rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
h1{margin:0;font-family:Georgia,"Times New Roman",serif;font-size:clamp(1.8rem,4vw,2.7rem);line-height:1.08}
.hero p{margin:12px 0 0;color:var(--muted);line-height:1.65;max-width:760px}
.section{margin-top:18px;padding:22px 24px;border:1px solid var(--line);border-radius:18px;background:var(--paper)}
.section h2{margin:0 0 8px;font-family:Georgia,"Times New Roman",serif;font-size:1.35rem}
.notice{margin-top:14px;padding:18px 20px;border:1px dashed #ccbcae;border-radius:14px;background:#fbf8f4;color:var(--muted);line-height:1.6}
.footer{margin-top:22px;text-align:center;color:var(--muted);font-size:.83rem}
@media(max-width:640px){.page{width:min(100% - 20px,1180px);margin-top:14px}.hero{padding:21px 19px}.section{padding:18px 16px}.topbar{align-items:flex-start}}
</style>
</head>
<body>
<main class="page">
  <div class="topbar">
    <a class="back-link" href="concursuri-post-psiholog.html">← Înapoi la Concursuri – post psiholog</a>
  </div>
  <section class="hero">
    <p class="eyebrow">Evaluări psihologice</p>
    <h1>Exerciții pentru evaluarea psihologică a candidaților la unitățile de învățământ cu profil militar</h1>
  </section>
  <section class="section">
    <h2>Exerciții de familiarizare</h2>
    <div class="notice"><strong>În lucru.</strong> Aici vor fi adăugate exercițiile suplimentare.</div>
  </section>
  <p class="footer">© 2026 Marin Gabriel</p>
</main>
</body>
</html>
