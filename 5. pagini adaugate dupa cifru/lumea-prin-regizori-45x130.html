<script>
const allDirectors = [
  "Charlie Chaplin","Buster Keaton","John Ford","Howard Hawks",
  "Orson Welles","Fritz Lang","Billy Wilder","Frank Capra",
  "Victor Fleming","William Wyler","John Huston","Ernst Lubitsch",
  "D.W. Griffith","Carl Theodor Dreyer","Cecil B. DeMille","Jean Renoir",
  "George Cukor","Elia Kazan","Douglas Sirk","Nicholas Ray",
  "François Truffaut","Jean-Luc Godard","Agnès Varda","Alain Resnais",
  "Jacques Demy","Federico Fellini","Michelangelo Antonioni","Roberto Rossellini",
  "Vittorio De Sica","Luchino Visconti","Pier Paolo Pasolini","Bernardo Bertolucci",
  "Jean-Pierre Melville","Robert Bresson","Jacques Tati","Krzysztof Kieślowski",
  "Andrzej Wajda","Wim Wenders","Werner Herzog","Rainer Werner Fassbinder",
  "Yasujirō Ozu","Kenji Mizoguchi","Hayao Miyazaki","Isao Takahata",
  "Satyajit Ray","Wong Kar-wai","Edward Yang","Hou Hsiao-hsien",
  "Zhang Yimou","Chen Kaige","Bong Joon-ho","Park Chan-wook",
  "Asghar Farhadi","Abbas Kiarostami","Jafar Panahi","Béla Tarr",
  "Miloš Forman","Emir Kusturica","Alejandro Jodorowsky","Guillermo del Toro",
  "James Cameron","George Lucas","Peter Jackson","Denis Villeneuve",
  "Alfonso Cuarón","Alejandro G. Iñárritu","George Miller","Paul Verhoeven",
  "Luc Besson","John Carpenter","Tim Burton","Terry Gilliam",
  "Zack Snyder","J.J. Abrams","Lana & Lilly Wachowski","Robert Zemeckis",
  "Gareth Edwards","Matt Reeves","Bryan Singer","Roland Emmerich",
  "Wes Craven","Tobe Hooper","George A. Romero","Dario Argento",
  "Mario Bava","David Cronenberg","Sam Raimi","Brian De Palma",
  "John Frankenheimer","Roman Polanski","William Friedkin","Jordan Peele",
  "Ari Aster","Robert Eggers","James Wan","M. Night Shyamalan",
  "Fede Álvarez","Ti West","David Bruckner","Alexandre Aja",
  "Paul Thomas Anderson","Wes Anderson","Frații Coen","Richard Linklater",
  "Spike Lee","Gus Van Sant","Steven Soderbergh","Jim Jarmusch",
  "Noah Baumbach","Sofia Coppola","Greta Gerwig","Damien Chazelle",
  "Barry Jenkins","Sean Baker","Céline Sciamma","Ruben Östlund",
  "Yorgos Lanthimos","Thomas Vinterberg","Lars von Trier","Michael Haneke",
  "Ken Loach","Mike Leigh","Terrence Malick","Darren Aronofsky",
  "Alejandro Amenábar","Pedro Almodóvar","Todd Haynes","Ang Lee",
  "Jane Campion","Tom Hooper","Oliver Stone","Ron Howard",
  "Clint Eastwood","Sidney Lumet","Alan J. Pakula","Costa-Gavras",
  "Jean-Marc Vallée","Hirokazu Kore-eda","Lee Chang-dong","Ryusuke Hamaguchi",
  "Sergio Leone","Sam Peckinpah","John McTiernan","Tony Scott",
  "Michael Mann","Kathryn Bigelow","Mel Gibson","Antoine Fuqua",
  "Chad Stahelski","David Leitch","Edgar Wright","Guy Ritchie",
  "Matthew Vaughn","John Woo","Jackie Chan","Tsui Hark",
  "King Hu","S.S. Rajamouli","Justin Lin","F. Gary Gray",
  "Mel Brooks","Woody Allen","Taika Waititi","Judd Apatow",
  "Todd Phillips","Adam McKay","Peter Farrelly","Bobby Farrelly",
  "John Hughes","Ivan Reitman","Chris Columbus","Gore Verbinski",
  "Jon Favreau","James Gunn","Peyton Reed","Ryan Coogler",
  "Destin Daniel Cretton","Chloé Zhao","Penny Marshall","Agnieszka Holland",
  "Quentin Tarantino","Kim Ki-duk","Akira Kurosawa","F.W. Murnau",
  "Andrei Tarkovski","Sergei Eisenstein","Ingmar Bergman","Alfred Hitchcock",
  "Steven Spielberg","Stanley Kubrick","David Lynch","Luis Buñuel",
  "Christopher Nolan","Ridley Scott","Martin Scorsese","Francis Ford Coppola",
  "David Fincher"
];

const byNumber = allDirectors.map((name, idx) => ({ n: idx + 1, name }));
const rows = [];
for(let i=0;i<18;i++) rows.push(byNumber.slice(i*10, i*10 + 10));
rows.push(byNumber.slice(188,197));
rows.push([byNumber[180], byNumber[182], byNumber[183], byNumber[184], byNumber[181], byNumber[186], byNumber[185], byNumber[187]]);

const NS = "http://www.w3.org/2000/svg";
function E(tag, attrs={}, parent=null){
  const el=document.createElementNS(NS,tag);
  for(const[k,v] of Object.entries(attrs)) el.setAttribute(k,v);
  if(parent) parent.appendChild(el);
  return el;
}

function labelFor(name){
  const parts = name.trim().split(/\s+/);
  if(parts.length <= 2) return parts;
  let bestSplit = 1;
  let bestScore = Infinity;
  for(let i=1;i<parts.length;i++){
    const a = parts.slice(0,i).join(" ");
    const b = parts.slice(i).join(" ");
    const score = Math.abs(a.length-b.length) + Math.max(a.length,b.length)*0.15;
    if(score < bestScore){bestScore=score;bestSplit=i;}
  }
  return [parts.slice(0,bestSplit).join(" "),parts.slice(bestSplit).join(" ")];
}

function addTextLines(parent, lines, cx, y, width, fontSize=33, lineStep=38){
  const group=E("text",{x:cx,y:y,"text-anchor":"middle",class:"directorText","font-size":String(fontSize)},parent);
  lines.slice(0,2).forEach((line,idx)=>{
    const t=E("tspan",{x:cx,dy:idx===0?0:lineStep},group);
    t.textContent=line;
    const approx=line.length*fontSize*0.50;
    if(approx>width){t.setAttribute("textLength",width);t.setAttribute("lengthAdjust","spacingAndGlyphs");}
  });
}

function drawTile(parent, item, x, y, emphasize=false){
  const tileW=395, boxW=200, boxH=300;
  const g=E("g",{},parent);
  E("rect",{x:x+(tileW-boxW)/2,y:y,width:boxW,height:boxH,fill:"none",stroke:"#173f28","stroke-width": emphasize ? "10" : "7"},g);
  addTextLines(g,[String(item.n)+"."],x+tileW/2,y+boxH+42,302,33,38);
  addTextLines(g,labelFor(item.name),x+tileW/2,y+boxH+84,350,33,38);
}

function renderRow(parent, items, rowIndex, y){
  const tileW=395, step=397;
  const totalW=(items.length-1)*step + tileW;
  const x0=(4500-totalW)/2;
  const emphasize = rowIndex === 19;
  items.forEach((item, idx)=> drawTile(parent, item, x0 + idx*step, y, emphasize));
}

function renderDirectors(){
  const grid=document.getElementById("directorGrid");
  const startY=1155;
  const inPairStep=455;
  const groupGap=95;

  rows.forEach((items, rowIndex)=>{
    const pairIndex = Math.floor(rowIndex/2);
    const inPair = rowIndex % 2;
    const y = startY + pairIndex*(inPairStep*2 + groupGap) + inPair*inPairStep;
    renderRow(grid, items, rowIndex, y);
  });
}
renderDirectors();

function downloadSVG(){
  const svg=document.getElementById("poster");
  const clone=svg.cloneNode(true);
  clone.setAttribute("xmlns","http://www.w3.org/2000/svg");
  clone.setAttribute("width","45cm");
  clone.setAttribute("height","130cm");
  const source='<?xml version="1.0" encoding="UTF-8"?>\n'+new XMLSerializer().serializeToString(clone);
  const blob=new Blob([source],{type:"image/svg+xml;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  a.download="lumea-prin-regizori-45x130cm.svg";
  document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
}

function downloadPNG300(){
  const svg=document.getElementById("poster");
  const clone=svg.cloneNode(true);
  const pxW=5315, pxH=15354;
  clone.setAttribute("width",String(pxW));
  clone.setAttribute("height",String(pxH));
  const source=new XMLSerializer().serializeToString(clone);
  const blob=new Blob([source],{type:"image/svg+xml;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const img=new Image();
  img.onload=function(){
    const canvas=document.createElement("canvas");
    canvas.width=pxW;canvas.height=pxH;
    const ctx=canvas.getContext("2d");
    ctx.fillStyle="#edf3d4";ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.drawImage(img,0,0,canvas.width,canvas.height);
    URL.revokeObjectURL(url);
    canvas.toBlob(function(pngBlob){
      const pngUrl=URL.createObjectURL(pngBlob);
      const a=document.createElement("a");
      a.href=pngUrl;
      a.download="lumea-prin-regizori-45x130cm-300dpi.png";
      document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(pngUrl);
    },"image/png");
  };
  img.onerror=function(){URL.revokeObjectURL(url);alert("Exportul PNG nu a reușit. Folosește SVG sau PDF pentru tipar.");};
  img.src=url;
}
</script>
